<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVA1 Inbound Dock - Gestion des données</title>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        // Vérifier l'authentification avant de charger l'app
        const REMEMBER_KEY = 'bva1_dock_authenticated';
        
        function checkAuthentication() {
            if (localStorage.getItem(REMEMBER_KEY) !== 'true') {
                // Non authentifié, rediriger vers login
                window.location.href = 'login.html';
                return false;
            }
            
            // Vérifier que le token n'est pas expiré (24 heures)
            const savedTime = parseInt(localStorage.getItem(REMEMBER_KEY + '_time'));
            const now = new Date().getTime();
            const dayInMs = 24 * 60 * 60 * 1000;

            if (now - savedTime >= dayInMs) {
                // Token expiré
                localStorage.removeItem(REMEMBER_KEY);
                localStorage.removeItem(REMEMBER_KEY + '_time');
                window.location.href = 'login.html';
                return false;
            }
            
            return true;
        }

        if (checkAuthentication()) {
            import('/src/main.js');
        }
    </script>
</body>
</html>
