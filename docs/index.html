<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVA1 Inbound Dock - Gestion des données</title>
</head>
<body>
    <div id="app"></div>
    <script type="module">
        // Vérifier l'authentification
        const REMEMBER_KEY = 'bva1_dock_authenticated';
        
        if (localStorage.getItem(REMEMBER_KEY) !== 'true') {
            window.location.href = './login.html';
        } else {
            const savedTime = parseInt(localStorage.getItem(REMEMBER_KEY + '_time'));
            const now = new Date().getTime();
            const dayInMs = 24 * 60 * 60 * 1000;

            if (now - savedTime >= dayInMs) {
                localStorage.removeItem(REMEMBER_KEY);
                localStorage.removeItem(REMEMBER_KEY + '_time');
                window.location.href = './login.html';
            } else {
                // Charger l'app Vue
                import('/FluxInboundDock/assets/index-DFxoU5Oz.js');
            }
        }
    </script>
</body>
</html>
