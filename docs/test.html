<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BVA1 Inbound Dock - TEST</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; margin-bottom: 20px; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .test-box { border: 1px solid #ddd; padding: 15px; border-radius: 4px; }
        .test-box h3 { color: #667eea; margin-bottom: 10px; }
        .status { padding: 5px 10px; border-radius: 4px; margin: 5px 0; font-size: 14px; }
        .status.success { background: #27ae60; color: white; }
        .status.error { background: #e74c3c; color: white; }
        .status.info { background: #3498db; color: white; }
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 BVA1 Inbound Dock - Mode Test</h1>
        
        <div class="test-grid">
            <div class="test-box">
                <h3>État de l'application</h3>
                <div id="appStatus"></div>
            </div>
            
            <div class="test-box">
                <h3>Fichiers chargés</h3>
                <div id="filesStatus"></div>
            </div>
            
            <div class="test-box">
                <h3>LocalStorage</h3>
                <div id="storageStatus"></div>
            </div>
        </div>

        <h2 style="margin-top: 30px;">📊 Données de test</h2>
        <table>
            <thead>
                <tr>
                    <th>VRID</th>
                    <th>Statut</th>
                    <th>Pallets</th>
                    <th>Units</th>
                    <th>Location</th>
                </tr>
            </thead>
            <tbody id="testData">
                <tr><td colspan="5" style="text-align: center;">Chargement des données...</td></tr>
            </tbody>
        </table>

        <h2 style="margin-top: 30px;">🔍 Console</h2>
        <pre id="console" style="background: #2b2b2b; color: #f8f8f2; padding: 15px; border-radius: 4px; overflow-x: auto; max-height: 300px;"></pre>
    </div>

    <script>
        const testConsole = [];
        
        function log(msg, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            testConsole.push(`[${timestamp}] ${msg}`);
            document.getElementById('console').textContent = testConsole.join('\n');
            console.log(msg);
        }

        // Test app status
        function testAppStatus() {
            const appEl = document.getElementById('app');
            const status = appEl ? '✅ App element found' : '❌ App element NOT found';
            document.getElementById('appStatus').innerHTML = `<div class="status ${status.includes('✅') ? 'success' : 'error'}">${status}</div>`;
            log(status);
        }

        // Test localStorage
        function testStorage() {
            try {
                localStorage.setItem('test', 'ok');
                const value = localStorage.getItem('test');
                localStorage.removeItem('test');
                const status = value === 'ok' ? '✅ LocalStorage works' : '❌ LocalStorage broken';
                document.getElementById('storageStatus').innerHTML = `<div class="status success">${status}</div>`;
                log(status);
            } catch (e) {
                log(`❌ LocalStorage error: ${e.message}`, 'error');
            }
        }

        // Load test data
        function loadTestData() {
            const testVrids = [
                { vrid: 'AFT001', statut: 'IN PROGRESS', pallets: 5, units: 150, location: 'QUAI_1' },
                { vrid: 'AFT002', statut: 'VRAC', pallets: 3, units: 120, location: 'ZONE_VRAC' },
                { vrid: 'AFT003', statut: 'DONE', pallets: 2, units: 80, location: 'STOCK_A' }
            ];

            const tbody = document.getElementById('testData');
            tbody.innerHTML = testVrids.map(vrid => `
                <tr>
                    <td>${vrid.vrid}</td>
                    <td>${vrid.statut}</td>
                    <td>${vrid.pallets}</td>
                    <td>${vrid.units}</td>
                    <td>${vrid.location}</td>
                </tr>
            `).join('');
            
            log('✅ Test data loaded');
        }

        // Check files
        function checkFiles() {
            const files = [
                { name: 'index.html', path: 'index.html' },
                { name: 'login.html', path: 'login.html' },
                { name: 'Vue JS', path: 'assets/index-DFxoU5Oz.js' }
            ];

            let html = '';
            files.forEach(f => {
                html += `<div class="status info">📄 ${f.name}</div>`;
            });
            document.getElementById('filesStatus').innerHTML = html;
            log('✅ Files verified');
        }

        // Initialize
        window.addEventListener('load', function() {
            log('🚀 Test page loaded');
            testAppStatus();
            testStorage();
            checkFiles();
            loadTestData();
            log('✅ All tests completed');
        });
    </script>
</body>
</html>
